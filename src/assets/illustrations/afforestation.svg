<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#F0FDF4"/>
  
  <!-- Ground -->
  <ellipse cx="200" cy="260" rx="180" ry="30" fill="#D1FAE5"/>
  <rect x="20" y="255" width="360" height="45" rx="8" fill="#A7F3D0"/>

  <!-- Large center tree (Miyawaki style) -->
  <rect x="188" y="160" width="24" height="90" rx="6" fill="#854D0E"/>
  <ellipse cx="200" cy="135" rx="52" ry="62" fill="#16A34A"/>
  <ellipse cx="200" cy="118" rx="38" ry="46" fill="#22C55E"/>
  <ellipse cx="200" cy="105" rx="24" ry="30" fill="#4ADE80"/>

  <!-- Left tree -->
  <rect x="102" y="195" width="16" height="60" rx="4" fill="#92400E"/>
  <ellipse cx="110" cy="175" rx="34" ry="40" fill="#15803D"/>
  <ellipse cx="110" cy="162" rx="24" ry="28" fill="#16A34A"/>

  <!-- Right tree -->
  <rect x="282" y="195" width="16" height="60" rx="4" fill="#92400E"/>
  <ellipse cx="290" cy="175" rx="34" ry="40" fill="#15803D"/>
  <ellipse cx="290" cy="162" rx="24" ry="28" fill="#16A34A"/>

  <!-- Small saplings left -->
  <rect x="55" y="228" width="8" height="28" rx="3" fill="#A16207"/>
  <ellipse cx="59" cy="217" rx="16" ry="18" fill="#166534"/>

  <!-- Small saplings right -->
  <rect x="337" y="228" width="8" height="28" rx="3" fill="#A16207"/>
  <ellipse cx="341" cy="217" rx="16" ry="18" fill="#166534"/>

  <!-- CO2 sequestration arrows -->
  <path d="M 340 80 Q 310 110 280 135" stroke="#15803D" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 60 80 Q 90 110 120 135" stroke="#15803D" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowGreen)"/>
  
  <!-- CO2 cloud left -->
  <rect x="20" y="55" width="78" height="34" rx="17" fill="#D1FAE5" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="59" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">CO₂ ↓</text>

  <!-- O2 cloud right -->
  <rect x="298" y="55" width="78" height="34" rx="17" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="337" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D">O₂ ↑</text>

  <!-- Urban buildings silhouette in background -->
  <rect x="310" y="170" width="28" height="85" rx="3" fill="#BBF7D0" opacity="0.6"/>
  <rect x="344" y="185" width="22" height="70" rx="3" fill="#A7F3D0" opacity="0.6"/>
  <rect x="28" y="178" width="26" height="77" rx="3" fill="#BBF7D0" opacity="0.6"/>
  
  <!-- Sun -->
  <circle cx="200" cy="40" r="20" fill="#FCD34D"/>
  <path d="M200 14 v-8 M200 74 v8 M174 40 h-8 M234 40 h8 M183 23 l-6-6 M223 57 l6 6 M217 23 l6-6 M183 57 l-6 6" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round"/>

  <defs>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#15803D"/>
    </marker>
  </defs>
</svg>
