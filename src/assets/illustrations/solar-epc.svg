<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Sky gradient background -->
  <rect width="400" height="300" fill="#FFFBEB"/>

  <!-- Ground -->
  <rect x="0" y="240" width="400" height="60" rx="0" fill="#FEF3C7"/>
  <ellipse cx="200" cy="242" rx="200" ry="14" fill="#FDE68A"/>

  <!-- Solar panel array - main panel left -->
  <g transform="translate(40, 130)">
    <rect x="0" y="20" width="130" height="80" rx="6" fill="#1E3A5F" transform="skewY(-8)"/>
    <!-- Grid lines -->
    <line x1="32" y1="18" x2="32" y2="102" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="65" y1="16" x2="65" y2="100" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="98" y1="14" x2="98" y2="98" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="46" x2="130" y2="38" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="72" x2="130" y2="64" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <!-- Shine -->
    <rect x="10" y="22" width="40" height="18" rx="2" fill="#60A5FA" opacity="0.3" transform="skewY(-8)"/>
  </g>

  <!-- Solar panel array - main panel right -->
  <g transform="translate(230, 120)">
    <rect x="0" y="20" width="130" height="80" rx="6" fill="#1E3A5F" transform="skewY(-8)"/>
    <!-- Grid lines -->
    <line x1="32" y1="18" x2="32" y2="102" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="65" y1="16" x2="65" y2="100" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="98" y1="14" x2="98" y2="98" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="46" x2="130" y2="38" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="72" x2="130" y2="64" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <!-- Shine -->
    <rect x="10" y="22" width="40" height="18" rx="2" fill="#60A5FA" opacity="0.3" transform="skewY(-8)"/>
  </g>

  <!-- Panel legs -->
  <line x1="80" y1="215" x2="75" y2="245" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="215" x2="155" y2="245" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="210" x2="265" y2="245" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="208" x2="348" y2="245" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>

  <!-- Inverter/control box -->
  <rect x="170" y="195" width="60" height="42" rx="6" fill="#374151"/>
  <rect x="176" y="201" width="18" height="12" rx="2" fill="#10B981"/>
  <rect x="200" y="201" width="24" height="8" rx="2" fill="#6B7280"/>
  <circle cx="183" cy="225" r="5" fill="#34D399"/>
  <circle cx="199" cy="225" r="5" fill="#FBBF24"/>
  <circle cx="215" cy="225" r="5" fill="#60A5FA"/>

  <!-- Cable line -->
  <path d="M 170 216 Q 140 216 115 216" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 230 216 Q 260 216 280 216" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sun with rays -->
  <circle cx="200" cy="50" r="28" fill="#F59E0B"/>
  <circle cx="200" cy="50" r="20" fill="#FCD34D"/>
  <path d="M200 16 v-10 M200 94 v10 M166 50 h-10 M244 50 h10 M178 28 l-7-7 M229 71 l7 7 M222 28 l7-7 M178 72 l-7 7" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Energy flow arrows from sun to panel -->
  <path d="M185 74 L145 152" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,4" opacity="0.7" marker-end="url(#arrowYellow)"/>
  <path d="M215 74 L285 145" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,4" opacity="0.7" marker-end="url(#arrowYellow)"/>

  <!-- kWh output badge -->
  <rect x="290" y="60" width="90" height="36" rx="18" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="335" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065F46">⚡ 0 Carbon</text>

  <defs>
    <marker id="arrowYellow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#FBBF24"/>
    </marker>
  </defs>
</svg>
