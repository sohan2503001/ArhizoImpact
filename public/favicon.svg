<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0F4D3C" />
      <stop offset="70%" stop-color="#08251B" />
      <stop offset="100%" stop-color="#03130C" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="50%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#B87E22" />
    </linearGradient>
    <linearGradient id="favLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F624D" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2" />

  <!-- Orbit ring -->
  <path d="M 18,38 A 18,18 0 1,1 46,24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <circle cx="46" cy="24" r="2" fill="url(#favGold)" />

  <!-- Rhizome roots -->
  <path d="M 32,36 C 27,38 22,41 19,46 C 23,45 27,43 30,39 Z" fill="url(#favGold)" />
  <path d="M 32,36 C 37,38 42,41 45,46 C 41,45 37,43 34,39 Z" fill="url(#favGold)" />
  <circle cx="19" cy="46" r="1.5" fill="#FDF0D5" />
  <circle cx="45" cy="46" r="1.5" fill="#FDF0D5" />
  <circle cx="32" cy="47" r="1.2" fill="#FDF0D5" />

  <!-- Ascending leaves -->
  <path d="M 24,33 C 23,26 27,19 32,13 C 30,19 30,26 28,32 Z" fill="url(#favLeaf)" />
  <path d="M 40,33 C 41,26 37,19 32,13 C 34,19 34,26 36,32 Z" fill="url(#favLeaf)" opacity="0.9" />

  <!-- Central node -->
  <ellipse cx="32" cy="34" rx="3.5" ry="1.2" fill="none" stroke="url(#favGold)" stroke-width="1.2" />
  <circle cx="32" cy="13" r="1.5" fill="url(#favGold)" />
</svg>