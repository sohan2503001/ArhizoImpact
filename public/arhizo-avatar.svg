<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0E4334" />
      <stop offset="45%" stop-color="#08251B" />
      <stop offset="100%" stop-color="#03130C" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="25%" stop-color="#E5B869" />
      <stop offset="70%" stop-color="#C68F33" />
      <stop offset="100%" stop-color="#93641B" />
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E5B869" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C68F33" stop-opacity="0.8" />
    </linearGradient>

    <!-- Emerald Nature Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#094A38" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Square Background for Rounded Square platforms -->
  <rect width="500" height="500" rx="60" fill="url(#avatarBg)" />

  <!-- Circular Outer Border for Instagram/LinkedIn round profile frames -->
  <circle cx="250" cy="250" r="235" stroke="url(#goldRing)" stroke-width="3" fill="none" opacity="0.85" />
  <circle cx="250" cy="250" r="226" stroke="#E5B869" stroke-width="1" stroke-dasharray="6 8" fill="none" opacity="0.35" />

  <!-- Decorative Subtle Radial Aura -->
  <circle cx="250" cy="210" r="140" fill="#10B981" opacity="0.07" filter="url(#softGlow)" />

  <!-- Main Brand Symbol Group -->
  <g filter="url(#subtleShadow)">
    <!-- Net Zero Circular Orbit Arc -->
    <path d="M 135,305 A 145,145 0 1,1 365,190" fill="none" stroke="url(#orbitGrad)" stroke-width="9" stroke-linecap="round" opacity="0.9" />
    
    <!-- Orbit Sun / Carbon Zero Node -->
    <circle cx="365" cy="190" r="12" fill="url(#goldGradient)" filter="url(#softGlow)" />
    <circle cx="365" cy="190" r="6" fill="#FFFFFF" opacity="0.8" />

    <!-- Rhizome Root Network (Livelihoods & Foundation) -->
    <!-- Left Root Tendril -->
    <path d="M 250,285 C 215,298 180,315 160,348 C 190,344 220,328 238,302 Z" fill="url(#goldGradient)" opacity="0.92" />
    <!-- Right Root Tendril -->
    <path d="M 250,285 C 285,298 320,315 340,348 C 310,344 280,328 262,302 Z" fill="url(#goldGradient)" opacity="0.92" />
    <!-- Center Taproot Anchor -->
    <path d="M 244,278 L 256,278 L 253,356 C 252,360 248,360 247,356 Z" fill="url(#goldGradient)" opacity="0.85" />

    <!-- Community Network Nodes -->
    <circle cx="160" cy="348" r="8" fill="#FDF0D5" />
    <circle cx="340" cy="348" r="8" fill="#FDF0D5" />
    <circle cx="250" cy="360" r="7" fill="#FDF0D5" />

    <!-- Central Nexus Ellipse (Representing 'A' bar & Grounding) -->
    <ellipse cx="250" cy="262" rx="28" ry="8" fill="none" stroke="url(#goldGradient)" stroke-width="6.5" />

    <!-- Ascending Emerald Leaves (Afforestation, Canopy & Climate Action) -->
    <!-- Left Leaf -->
    <path d="M 190,258 C 185,205 214,152 250,105 C 238,150 238,198 226,250 C 214,256 202,258 190,258 Z" fill="url(#leafGrad)" />
    <!-- Right Leaf -->
    <path d="M 310,258 C 315,205 286,152 250,105 C 262,150 262,198 274,250 C 286,256 298,258 310,258 Z" fill="url(#leafGrad)" opacity="0.9" />

    <!-- Central Leaf Ridge / Growth Axis -->
    <path d="M 250,112 L 250,258" stroke="#FDF0D5" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />

    <!-- Crown Apex Golden Seed -->
    <circle cx="250" cy="100" r="8.5" fill="url(#goldGradient)" filter="url(#softGlow)" />
  </g>

  <!-- Subtle Micro Brandmark at Bottom (Visible in square crops) -->
  <text x="250" y="420" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#FFFFFF">ARHIZO</text>
  <text x="250" y="446" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#E5B869">IMPACT</text>
</svg>
