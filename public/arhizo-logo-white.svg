<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="hwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="35%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#B87E22" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="hwLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#094A38" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Orbit Arc Gradient -->
    <linearGradient id="hwOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (Centered at x=60, y=60) -->
  <g transform="translate(60, 60)">
    <!-- Outer Golden Dashed Orbit Ring -->
    <circle cx="0" cy="0" r="48" stroke="url(#hwGold)" stroke-width="1" stroke-dasharray="3 4" opacity="0.4" />
    
    <!-- Net Zero Orbit Arc -->
    <path d="M -24,24 A 32,32 0 1,1 26,-18" fill="none" stroke="url(#hwOrbit)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <circle cx="26" cy="-18" r="3" fill="url(#hwGold)" />

    <!-- Rhizome Root Base -->
    <path d="M 0,16 C -9,20 -18,24 -24,32 C -16,30 -8,26 -2,20 Z" fill="url(#hwGold)" opacity="0.9" />
    <path d="M 0,16 C 9,20 18,24 24,32 C 16,30 8,26 2,20 Z" fill="url(#hwGold)" opacity="0.9" />
    <path d="M -1.5,14 L 1.5,14 L 0.8,34 C 0.5,35 -0.5,35 -0.8,34 Z" fill="url(#hwGold)" opacity="0.8" />

    <!-- Community Nodes -->
    <circle cx="-24" cy="32" r="2" fill="#FDF0D5" />
    <circle cx="24" cy="32" r="2" fill="#FDF0D5" />
    <circle cx="0" cy="34" r="1.6" fill="#FDF0D5" />

    <!-- Central Nexus Ellipse -->
    <ellipse cx="0" cy="11" rx="6" ry="1.8" fill="none" stroke="url(#hwGold)" stroke-width="1.6" />

    <!-- Ascending Emerald Leaves -->
    <path d="M -14,10 C -15,0 -8,-10 0,-22 C -2,-12 -2,-2 -5,8 C -8,9 -11,10 -14,10 Z" fill="url(#hwLeaf)" />
    <path d="M 14,10 C 15,0 8,-10 0,-22 C 2,-12 2,-2 5,8 C 8,9 11,10 14,10 Z" fill="url(#hwLeaf)" opacity="0.88" />

    <!-- Center Line -->
    <path d="M 0,-20 L 0,10" stroke="#FDF0D5" stroke-width="1" stroke-linecap="round" opacity="0.75" />
    <circle cx="0" cy="-23" r="2" fill="url(#hwGold)" />
  </g>

  <!-- Typography: Clean Modern Executive Consulting -->
  <g transform="translate(130, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="62" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">
      Arhizo <tspan fill="url(#hwGold)" font-weight="700">Impact</tspan>
    </text>

    <!-- Subtitle Tracked Out -->
    <text x="2" y="88" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="7" fill="#A7D5C5">
      CONSULTING
    </text>

    <!-- Subtle Accent Line -->
    <line x1="2" y1="98" x2="320" y2="98" stroke="url(#hwGold)" stroke-width="1" opacity="0.3" />
  </g>
</svg>
