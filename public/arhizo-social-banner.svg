<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="100%" height="100%">
  <defs>
    <!-- Rich Background Gradient -->
    <radialGradient id="bannerBg" cx="70%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#124E3D" />
      <stop offset="45%" stop-color="#09291E" />
      <stop offset="100%" stop-color="#04150E" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="35%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#B87E22" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="bLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#094A38" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="bOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#bannerBg)" />

  <!-- Subtle Contour / Net-Zero Wave Lines -->
  <g opacity="0.08" stroke="#34D399" stroke-width="1.5" fill="none">
    <path d="M 0,220 Q 400,120 800,240 T 1584,180" />
    <path d="M 0,260 Q 450,160 900,280 T 1584,220" />
    <path d="M 0,300 Q 500,200 1000,320 T 1584,260" />
  </g>

  <!-- Right Ambient Aura -->
  <circle cx="1350" cy="180" r="220" fill="#10B981" opacity="0.06" filter="url(#bGlow)" />
  <circle cx="1100" cy="90" r="140" fill="#E5B869" opacity="0.04" filter="url(#bGlow)" />

  <!-- Geometric Watermark in Background Right -->
  <g transform="translate(1360, 198) scale(2.2)" opacity="0.12">
    <circle cx="0" cy="0" r="70" stroke="url(#bGold)" stroke-width="1.5" stroke-dasharray="4 6" fill="none" />
    <path d="M -35,35 A 48,48 0 1,1 40,-25" fill="none" stroke="url(#bOrbit)" stroke-width="3.5" />
    <path d="M -22,15 C -24,0 -12,-15 0,-32 C 12,-15 24,0 22,15 Z" fill="url(#bLeaf)" />
  </g>

  <!-- Main Content Cluster (Positioned from x=360 to x=1450, leaving x=0..320 for LinkedIn profile photo overlay) -->
  <g transform="translate(360, 68)">
    <!-- Small Category Eyebrow -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="225" height="28" rx="14" fill="#0A3328" stroke="#E5B869" stroke-width="1" opacity="0.85" />
      <circle cx="14" cy="14" r="4" fill="#10B981" />
      <text x="26" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#FDF0D5">IMPACT ADVISORY</text>
    </g>

    <!-- Company Name Heading -->
    <text x="0" y="95" font-family="'Outfit', sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">
      Arhizo <tspan fill="url(#bGold)">Impact</tspan> <tspan fill="#A7D5C5" font-weight="500">Consulting</tspan>
    </text>

    <!-- Core Tagline -->
    <text x="0" y="142" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#D5EEE5">
      Transforming livelihoods and driving net zero action — <tspan fill="#FDF0D5" font-weight="600">for people, and for the planet.</tspan>
    </text>

    <!-- Three Strategic Focus Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="265" height="34" rx="8" fill="#08251B" stroke="#10B981" stroke-width="1" opacity="0.9" />
        <circle cx="16" cy="17" r="4" fill="#E5B869" />
        <text x="30" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FDF0D5">Livelihoods &amp; Enterprise</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="245" height="34" rx="8" fill="#08251B" stroke="#10B981" stroke-width="1" opacity="0.9" />
        <circle cx="16" cy="17" r="4" fill="#34D399" />
        <text x="30" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FDF0D5">ESG &amp; Net Zero Strategy</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="245" height="34" rx="8" fill="#08251B" stroke="#10B981" stroke-width="1" opacity="0.9" />
        <circle cx="16" cy="17" r="4" fill="#E5B869" />
        <text x="30" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FDF0D5">Carbon Zero Campus</text>
      </g>
    </g>

    <!-- Contact & Direct Inquiry Footer Line -->
    <g transform="translate(0, 248)">
      <circle cx="6" cy="6" r="3" fill="#E5B869" />
      <text x="18" y="10" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
        Advisory Desk: <tspan fill="#FDF0D5" font-weight="600">arhizoimpact@gmail.com</tspan>
      </text>
    </g>
  </g>
</svg>
